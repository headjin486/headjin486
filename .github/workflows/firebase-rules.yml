name: EARTH UNLOCK Firebase Rules Tests

on:
  push:
    branches: [main]
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  pull_request:
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: Install test dependencies
        working-directory: firebase
        run: npm install --no-audit --no-fund
      - name: Test Firestore rules in emulator
        working-directory: firebase
        run: npm run test:rules
