name: EARTH UNLOCK Android Build

on:
  push:
    branches: [main]
    paths:
      - 'EarthExplorerAndroid_MVP_v0.7.4_Source.zip'
      - '.github/workflows/earth-unlock-build.yml'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q EarthExplorerAndroid_MVP_v0.7.4_Source.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts
          # Kotlin const val cannot use trimIndent(); keep this immutable runtime value.
          sed -i 's/private const val POLICY_TEXT/private val POLICY_TEXT/' source/app/src/main/java/com/example/earthexplorer/PrivacyPolicyActivity.kt

      - name: Apply v0.7.5 app improvements
        run: python patches/apply_v075.py source

      - name: Apply v0.7.6 exploration and map improvements
        run: python patches/apply_v076.py source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Upload extracted source for next iteration
        uses: actions/upload-artifact@v4
        with:
          name: EARTH-UNLOCK-source-v0.7.4
          path: source/
          if-no-files-found: error
          retention-days: 7

      - name: Run static lifecycle checks
        working-directory: source
        run: bash scripts/verify-service-lifecycle.sh

      - name: Run unit tests and build debug APK
        working-directory: source
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify debug APK
        working-directory: source
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EARTH-UNLOCK-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
