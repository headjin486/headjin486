name: EARTH UNLOCK Android Build

on:
  push:
    branches: [main]
    paths:
      - 'EarthExplorerAndroid_MVP_v0.7.4_Source.zip'
      - '.github/workflows/earth-unlock-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q EarthExplorerAndroid_MVP_v0.7.4_Source.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run static lifecycle checks
        working-directory: source
        run: bash scripts/verify-service-lifecycle.sh

      - name: Run unit tests and build debug APK
        working-directory: source
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify debug APK
        working-directory: source
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EARTH-UNLOCK-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
