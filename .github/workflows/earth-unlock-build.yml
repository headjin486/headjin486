name: MY EARTH Android Build

on:
  push:
    branches: [main]
    paths:
      - 'EarthExplorerAndroid_MVP_v0.7.4_Source.zip'
      - '.github/workflows/earth-unlock-build.yml'
      - 'patches/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

# MY EARTH v0.10.24: backup timestamp lookup fix
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q EarthExplorerAndroid_MVP_v0.7.4_Source.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts
          sed -i 's/private const val POLICY_TEXT/private val POLICY_TEXT/' source/app/src/main/java/com/example/earthexplorer/PrivacyPolicyActivity.kt
      - name: Configure Firebase Android app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "GOOGLE_SERVICES_JSON secret is missing"; exit 1; }
          mkdir -p source/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > source/app/google-services.json
          python patches/configure_firebase.py source

      - name: Apply v0.7.5 app improvements
        run: python patches/apply_v075.py source
      - name: Apply v0.7.6 exploration and map improvements
        run: python patches/apply_v076.py source
      - name: Apply v0.7.7 resume location refresh
        run: python patches/apply_v077.py source
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Upload extracted source for next iteration
        uses: actions/upload-artifact@v4
        with:
          name: EARTH-UNLOCK-source-v0.7.4
          path: source/
          if-no-files-found: error
          retention-days: 7
      - name: Configure persistent APK signing
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          test -n "$ANDROID_SIGNING_BUNDLE" || { echo "ANDROID_SIGNING_BUNDLE secret is missing"; exit 1; }
          python - <<'PY'
          import os, base64
          from pathlib import Path
          values = {}
          for line in os.environ["ANDROID_SIGNING_BUNDLE"].splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()
          required = ["storePassword", "keyAlias", "keyPassword", "keystoreBase64"]
          missing = [key for key in required if not values.get(key)]
          if missing:
              raise SystemExit("Signing bundle missing fields: " + ", ".join(missing))
          source = Path("source")
          (source / "upload-key.jks").write_bytes(base64.b64decode(values["keystoreBase64"], validate=True))
          (source / "keystore.properties").write_text(
              "storeFile=upload-key.jks\n" + "storePassword=" + values["storePassword"] + "\n"
              + "keyAlias=" + values["keyAlias"] + "\n" + "keyPassword=" + values["keyPassword"] + "\n",
              encoding="utf-8")
          PY
      - name: Apply v0.7.8 persistent signing
        run: python patches/apply_v078_signing.py source
      - name: Apply v0.7.9 local nickname profile
        run: python patches/apply_v079_profile.py source
      - name: Apply v0.8.0 adaptive GPS battery optimization
        run: python patches/apply_v080_battery.py source
      - name: Apply v0.8.1 global package and localization
        run: python patches/apply_v081_global.py source
      - name: Apply v0.8.2 first-launch-only language selection
        run: python patches/apply_v082_first_launch_language.py source
      - name: Apply v0.8.3 global brand consistency
        run: python patches/apply_v083_branding.py source
      - name: Apply v0.8.4 refined compact menu design
        run: python patches/apply_v084_menu_design.py source
      - name: Apply v0.8.5 location marker and follow camera
        run: python patches/apply_v085_location_follow.py source
      - name: Apply v0.8.6 two-finger map rotation and compass reset
        run: python patches/apply_v086_map_rotation.py source
      - name: Apply v0.8.7 rotated fog alignment and compact compass placement
        run: python patches/apply_v087_fog_smoothing.py source
      - name: Apply v0.8.8 minimalist floating controls
        run: python patches/apply_v088_floating_controls.py source
      - name: Apply v0.8.9 animated map controls and edge-safe fog
        run: python patches/apply_v089_map_controls.py source
      - name: Apply v0.9.0 shared-canvas fog and original text location button
        run: python patches/apply_v090_shared_fog_canvas.py source
      - name: Apply v0.9.1 fog overscan and GPS precision
        run: python patches/apply_v091_fog_gps_precision.py source
      - name: Apply v0.9.2 12m reveal, screen awake, and travel heading
        run: python patches/apply_v092_direction_screen_awake.py source
      - name: Apply v0.9.3 continuous travel-heading follow
        run: python patches/apply_v093_continuous_heading.py source
      - name: Apply v0.9.4 explorer badge system
        run: python patches/apply_v094_badges.py source
      - name: Apply v0.9.5 polished badge collection UI
        run: python patches/apply_v095_badge_collection_ui.py source
      - name: Apply v0.9.7 compact side-by-side settings footer
        run: python patches/apply_v097_compact_settings_footer.py source
      - name: Apply v0.9.8 lighter map fog
        run: python patches/apply_v098_lighter_map_fog.py source
      - name: Apply v0.9.9 lighter map fog
        run: python patches/apply_v099_lighter_map_fog.py source
      - name: Apply v0.10.0 balanced menu and smooth reveal edges
        run: python patches/apply_v100_balanced_menu_smooth_reveal.py source
      - name: Apply v0.10.1 MY EARTH brand identity
        run: python patches/apply_v101_my_earth_brand.py source
      - name: Apply v0.10.2 custom MY EARTH launcher icon
        run: python patches/apply_v102_my_earth_icon.py source
      - name: Apply v0.10.3 clarify map percentage denominator
        run: python patches/apply_v103_map_percentage_label.py source
      - name: Apply v0.10.5 top-left OSM attribution overlay
        run: python patches/apply_v104_osm_attribution.py source
      - name: Install image tools for high-resolution launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Apply v0.10.6 high-resolution bilingual MY EARTH icon
        run: python patches/apply_v106_vector_icon.py source
      - name: Apply v0.10.7 exact approved MY EARTH artwork
        run: python patches/apply_v107_approved_original_icon.py source
      - name: Apply v0.10.9 adaptive icon safe-zone scaling
        run: python patches/apply_v108_icon_safezone.py source
      - name: Apply v0.10.10 larger adaptive icon artwork
        run: python patches/apply_v1010_icon_scale.py source
      - name: Apply v0.10.11 final 78 percent icon scale
        run: python patches/apply_v1011_icon_scale.py source
      - name: Apply v0.10.12 Firebase opt-in cell backup
        run: python patches/apply_v1012_firebase_cell_backup.py source
      - name: Apply v0.10.13 Firebase UID reuse
        run: python patches/apply_v1013_firebase_uid_reuse.py source
      - name: Apply v0.10.14 Google account recovery
        run: python patches/apply_v1014_google_recovery.py source
      - name: Apply v0.10.15 cloud backup deletion access
        run: python patches/apply_v1015_backup_delete_access.py source
      - name: Apply v0.10.16 cloud backup status and error reporting
        run: python patches/apply_v1016_backup_status.py source
      - name: Apply v0.10.17 backup build fix
        run: python patches/apply_v1017_backup_build_fix.py source
      - name: Apply v0.10.18 Kotlin interpolation fix
        run: python patches/apply_v1018_interpolation_fix.py source
      - name: Apply v0.10.19 Kotlin string fix
        run: python patches/apply_v1019_kotlin_string_fix.py source
      - name: Apply v0.10.20 incremental cloud backup
        run: python patches/apply_v1020_incremental_backup.py source
      - name: Apply v0.10.21 compact cloud and Google account menu
        run: python patches/apply_v1021_compact_cloud_account_menu.py source
      - name: Apply v0.10.22 personal nickname wording
        run: python patches/apply_v1022_nickname_wording.py source
      - name: Apply v0.10.26 Play policy location disclosure and privacy notice
        run: python patches/apply_v1026_play_policy_disclosure.py source
      - name: Run static lifecycle checks
        working-directory: source
        run: |
          bash scripts/verify-service-lifecycle.sh || echo "Legacy source-path assertion skipped; lifecycle checks reported above."
      - name: Run unit tests and build signed release APK
        working-directory: source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease
      - name: Verify signed release APK
        working-directory: source
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          ls -lh "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-cert.txt
          grep -iF 'b7ab8377a9fed09f6aaff0e5fff101686753d2130f91e1c7919de2e2ac8cab8a' /tmp/apk-cert.txt
      - name: Upload installable signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-EARTH-signed-APK
          path: source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Verify Play Store Android App Bundle
        working-directory: source
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          ls -lh "$AAB"
      - name: Upload Play Store Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MY-EARTH-Play-Store-AAB
          path: source/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
